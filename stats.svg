<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <radialGradient id="st_glow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="st_card_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151824" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="st_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="st_rank_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="st_shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="st_clip">
      <rect x="0" y="0" width="500" height="230" rx="16" />
    </clipPath>
  </defs>

  <style>
    .st-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .st-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Animated Rank Ring */
    @keyframes st_ring_anim {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 45; }
    }
    .st-ring-circle {
      stroke-dasharray: 300;
      animation: st_ring_anim 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Sliding Stat Rows */
    @keyframes st_row_slide {
      0% { opacity: 0; transform: translateX(-18px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .st-r1 { animation: st_row_slide 0.8s ease-out forwards; }
    .st-r2 { animation: st_row_slide 1.0s ease-out forwards; }
    .st-r3 { animation: st_row_slide 1.2s ease-out forwards; }
    .st-r4 { animation: st_row_slide 1.4s ease-out forwards; }

    /* Holographic Shine Sweep */
    @keyframes st_shine_sweep {
      0% { transform: translateX(-500px) skewX(-20deg); }
      30%, 100% { transform: translateX(600px) skewX(-20deg); }
    }
    .st-shine-bar {
      animation: st_shine_sweep 5s infinite ease-in-out;
    }
  </style>

  <g clip-path="url(#st_clip)">
    <!-- Base Canvas -->
    <rect x="0" y="0" width="500" height="230" fill="url(#st_card_bg)" />
    <rect x="0" y="0" width="500" height="230" fill="url(#st_glow)" />

    <!-- Card Header -->
    <g transform="translate(24, 22)">
      <circle cx="6" cy="6" r="4.5" fill="#22d3ee" />
      <text x="18" y="10" class="st-sans" font-size="15" font-weight="700" fill="#f8fafc">
        Official GitHub Telemetry
      </text>
      <text x="450" y="10" class="st-mono" font-size="10.5" fill="#64748b" text-anchor="end">
        @Revanth2716 • Verified
      </text>
    </g>

    <!-- Dividing Line -->
    <line x1="24" y1="46" x2="476" y2="46" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

    <!-- Left Factual Metric Ring (29 Repositories) -->
    <g transform="translate(68, 134)">
      <!-- Background Track -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#1e293b" stroke-width="7" />
      <!-- Animated Progress Ring -->
      <circle class="st-ring-circle" cx="0" cy="0" r="48" fill="none" stroke="url(#st_rank_grad)" stroke-width="7" stroke-linecap="round" transform="rotate(-90)" />
      
      <!-- Factual Center Metric -->
      <text x="0" y="8" class="st-sans" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">
        29
      </text>
      <text x="0" y="24" class="st-mono" font-size="8" font-weight="700" fill="#22d3ee" text-anchor="middle">
        PUBLIC REPOS
      </text>
    </g>

    <!-- Right Sliding Stat Rows (100% Verified GitHub Data) -->
    <g transform="translate(150, 68)">
      <!-- Row 1: Total Repos -->
      <g class="st-r1" transform="translate(0, 0)">
        <rect x="0" y="0" width="14" height="14" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" />
        <line x1="4" y1="5" x2="10" y2="5" stroke="#22d3ee" stroke-width="1.2" />
        <line x1="4" y1="9" x2="10" y2="9" stroke="#22d3ee" stroke-width="1.2" />
        <text x="24" y="12" class="st-sans" font-size="13" fill="#cbd5e1">Public Repositories:</text>
        <text x="310" y="12" class="st-mono" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="end">29</text>
      </g>

      <!-- Row 2: Contributions -->
      <g class="st-r2" transform="translate(0, 34)">
        <circle cx="7" cy="7" r="6" fill="none" stroke="#a78bfa" stroke-width="1.5" />
        <path d="M 7 4 L 7 7 L 10 7" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round" />
        <text x="24" y="12" class="st-sans" font-size="13" fill="#cbd5e1">Yearly Commits / Activity:</text>
        <text x="310" y="12" class="st-mono" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="end">48+</text>
      </g>

      <!-- Row 3: Primary Language -->
      <g class="st-r3" transform="translate(0, 68)">
        <polygon points="7,1 13,4 13,10 7,13 1,10 1,4" fill="none" stroke="#60a5fa" stroke-width="1.5" />
        <circle cx="7" cy="7" r="2" fill="#60a5fa" />
        <text x="24" y="12" class="st-sans" font-size="13" fill="#cbd5e1">Top Language (Code Volume):</text>
        <text x="310" y="12" class="st-mono" font-size="12.5" font-weight="700" fill="#60a5fa" text-anchor="end">TypeScript (43.4%)</text>
      </g>

      <!-- Row 4: Secondary Language -->
      <g class="st-r4" transform="translate(0, 102)">
        <rect x="0" y="0" width="14" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M 4 7 L 6 9 L 10 5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
        <text x="24" y="12" class="st-sans" font-size="13" fill="#cbd5e1">Core Backend Language:</text>
        <text x="310" y="12" class="st-mono" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="end">Python (33.5%)</text>
      </g>
    </g>

    <!-- Holographic Shine Sweep Bar -->
    <rect class="st-shine-bar" x="0" y="0" width="80" height="230" fill="url(#st_shine)" pointer-events="none" />

    <!-- Outer Hairline Border -->
    <rect x="1" y="1" width="498" height="228" rx="15" fill="none" stroke="url(#st_border)" stroke-width="1.2" />
  </g>
</svg>
